<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Відкрий аромат у 2taj — бутику нішевої парфумерії.">

    <title>Аромат — NOIR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">

    <script src="js/script.js" defer></script>
    <script src="js/product.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-container">

            <a href="index.html" class="logo">2taj<span>.</span></a>

            <nav class="nav">
                <a href="index.html#collection">Колекція</a>
                <a href="index.html#about">Про нас</a>
                <a href="index.html#philosophy">Філософія</a>
            </nav>

            <div class="header-actions">

                <a href="index.html#collection" class="header-action">
                    Повернутися до колекції <span>↗</span>
                </a>

                <button class="header-action" id="openCart">
                    Відкрити кошик <span>↗</span>
                    <span id="cartCount">0</span>
                </button>

            </div>

        </div>
    </header>


    <main class="product-page">

        <a href="index.html#collection" class="back-link">
            ← Назад до колекції
        </a>

        <div id="productDetails" class="product-details">
            <p>Завантаження аромату...</p>
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <a href="index.html" class="logo">NOIR<span>.</span></a>

        <p>SCENT IS A FORM OF MEMORY.</p>

        <div class="footer-links">
            <a href="index.html#collection">Колекція</a>
            <a href="index.html#about">Про нас</a>
            <a href="index.html#philosophy">Філософія</a>
        </div>

        <p class="copyright">
            © 2026 2taj. CONCEPT BOUTIQUE.
        </p>

    </footer>


    <!-- CART -->
    <div class="cart-overlay" id="cartOverlay">

        <div class="cart-panel">

            <div class="cart-header">
                <h2>Ваш кошик</h2>
                <button id="closeCart">✕</button>
            </div>

            <div id="cartItems">
                <p>Ваш кошик поки порожній.</p>
            </div>

            <div class="cart-footer">
                <p>
                    Разом:
                    <span id="cartTotal">0 ₴</span>
                </p>
            </div>

        </div>

    </div>

</body>
</html>
